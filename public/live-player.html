<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>摸獎券直播</title>
  <link href="https://web.sdk.qcloud.com/player/tcplayer/release/v4.7.2/tcplayer.min.css" rel="stylesheet"/>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }
    .player-container {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    #player-wrapper {
      width: 100%;
      max-width: 1280px;
      position: relative;
    }
    .loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      z-index: 1000;
    }
    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      margin-top: 20px;
      font-size: 16px;
    }
    .error-container {
      text-align: center;
      color: #fff;
      padding: 40px;
    }
    .error-icon {
      font-size: 60px;
      margin-bottom: 20px;
    }
    .error-title {
      font-size: 24px;
      margin-bottom: 10px;
    }
    .error-message {
      font-size: 14px;
      color: #999;
      margin-bottom: 20px;
    }
    .retry-btn {
      padding: 10px 30px;
      background: #1890ff;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    .retry-btn:hover {
      background: #40a9ff;
    }
    .info-bar {
      background: rgba(0,0,0,0.7);
      color: #fff;
      padding: 10px 20px;
      width: 100%;
      max-width: 1280px;
      margin-top: 10px;
      border-radius: 4px;
      font-size: 12px;
    }
    .status-indicator {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 8px;
      animation: pulse 2s infinite;
    }
    .status-live {
      background: #52c41a;
    }
    .status-error {
      background: #ff4d4f;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body>
  <div class="player-container">
    <div id="player-wrapper">
      <!-- 加载中遮罩 -->
      <div id="loading-overlay" class="loading-overlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">正在連接直播...</div>
      </div>

      <!-- 错误提示 -->
      <div id="error-container" class="error-container" style="display: none;">
        <div class="error-icon">⚠️</div>
        <div class="error-title">直播連接失敗</div>
        <div id="error-message" class="error-message"></div>
        <button class="retry-btn" onclick="retryConnect()">重試</button>
      </div>

      <!-- 播放器容器 -->
      <video
        id="player-container"
        preload="auto"
        playsinline
        webkit-playsinline
        x5-playsinline
        style="width: 100%; height: auto; display: none;"
      ></video>
    </div>

    <!-- 信息栏 -->
    <div id="info-bar" class="info-bar" style="display: none;">
      <span id="status-indicator" class="status-indicator status-live"></span>
      <span id="status-text">直播中</span>
      <span style="margin-left: 20px;">協議：<span id="protocol-text">-</span></span>
    </div>
  </div>

  <script src="https://web.sdk.qcloud.com/player/tcplayer/release/v4.7.2/tcplayer.v4.7.2.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    let player = null;
    let liveUrl = '';

    // 获取URL参数
    function getUrlParam(name) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(name);
    }

    // 检测协议类型
    function detectProtocol(url) {
      if (!url) return 'unknown';

      const lowerUrl = url.toLowerCase();
      if (lowerUrl.startsWith('rtmp://')) return 'rtmp';
      if (lowerUrl.includes('.m3u8')) return 'hls';
      if (lowerUrl.includes('.flv')) return 'flv';
      if (lowerUrl.startsWith('http://') || lowerUrl.startsWith('https://')) return 'http';

      return 'unknown';
    }

    // 初始化播放器
    function initPlayer() {
      liveUrl = getUrlParam('url');

      if (!liveUrl) {
        showError('未提供直播地址');
        return;
      }

      const protocol = detectProtocol(liveUrl);
      document.getElementById('protocol-text').textContent = protocol.toUpperCase();

      try {
        const playerConfig = {
          autoplay: true,
          preload: 'auto',
          width: '100%',
          height: 'auto',
          live: true,
          controls: 'default',
          controlBar: {
            playToggle: true,
            progressControl: false, // 直播不需要进度条
            volumePanel: true,
            currentTimeDisplay: false,
            timeDivider: false,
            durationDisplay: false,
            fullscreenToggle: true
          },
          // 根据协议配置播放源
          ...(protocol === 'rtmp' && { rtmp: liveUrl }),
          ...(protocol === 'flv' && { flv: liveUrl }),
          ...(protocol === 'hls' && { m3u8: liveUrl }),
          ...(protocol === 'http' && { mp4: liveUrl })
        };

        // 如果没有匹配的协议，尝试自动检测
        if (!playerConfig.rtmp && !playerConfig.flv && !playerConfig.m3u8 && !playerConfig.mp4) {
          // 尝试作为RTMP处理（因为用户提供的是腾讯云RTMP地址）
          playerConfig.rtmp = liveUrl;
          console.warn('未识别的协议，尝试作为RTMP处理');
        }

        player = TCPlayer('player-container', playerConfig);

        // 监听播放事件
        player.on('playing', function() {
          console.log('直播播放中...');
          hideLoading();
          showInfoBar('直播中', true);
        });

        player.on('waiting', function() {
          console.log('缓冲中...');
          showInfoBar('緩衝中...', true);
        });

        player.on('pause', function() {
          console.log('暂停');
          showInfoBar('已暫停', false);
        });

        player.on('ended', function() {
          console.log('直播结束');
          showInfoBar('直播已結束', false);
        });

        player.on('error', function(err) {
          console.error('播放错误:', err);
          let errorMsg = '播放錯誤';

          if (err && err.message) {
            errorMsg = err.message;
          }

          // 常见错误提示优化
          if (liveUrl.startsWith('rtmp://')) {
            errorMsg += '\n\nRTMP協議需要Flash支持，建議使用HLS或FLV格式。\n請聯繫直播服務商獲取HLS播放地址（.m3u8）。';
          }

          showError(errorMsg);
        });

        // 3秒后如果还在加载，显示提示
        setTimeout(() => {
          if (document.getElementById('loading-overlay').style.display !== 'none') {
            document.querySelector('.loading-text').textContent = '連接時間較長，請稍候...';
          }
        }, 3000);

      } catch (error) {
        console.error('初始化播放器失败:', error);
        showError('播放器初始化失敗：' + error.message);
      }
    }

    // 显示错误
    function showError(message) {
      hideLoading();
      document.getElementById('player-container').style.display = 'none';
      document.getElementById('error-message').textContent = message;
      document.getElementById('error-container').style.display = 'block';
      showInfoBar('連接失敗', false);
      document.getElementById('status-indicator').className = 'status-indicator status-error';
    }

    // 隐藏加载
    function hideLoading() {
      document.getElementById('loading-overlay').style.display = 'none';
      document.getElementById('player-container').style.display = 'block';
    }

    // 显示信息栏
    function showInfoBar(statusText, isLive) {
      document.getElementById('info-bar').style.display = 'block';
      document.getElementById('status-text').textContent = statusText;

      const indicator = document.getElementById('status-indicator');
      indicator.className = 'status-indicator ' + (isLive ? 'status-live' : 'status-error');
    }

    // 重试连接
    function retryConnect() {
      document.getElementById('error-container').style.display = 'none';
      document.getElementById('loading-overlay').style.display = 'flex';

      if (player) {
        player.dispose();
        player = null;
      }

      setTimeout(initPlayer, 500);
    }

    // 页面加载时初始化
    window.addEventListener('load', initPlayer);

    // 页面卸载时销毁播放器
    window.addEventListener('beforeunload', () => {
      if (player) {
        player.dispose();
      }
    });
  </script>
</body>
</html>
