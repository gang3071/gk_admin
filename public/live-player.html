<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>摸獎券直播</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      overflow: hidden;
    }
    .player-container {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    #video-container {
      width: 100%;
      height: 100%;
      position: relative;
      background: #000;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      z-index: 1000;
    }
    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      margin-top: 20px;
      font-size: 16px;
    }
    .error-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #fff;
      padding: 40px;
      z-index: 999;
    }
    .error-icon {
      font-size: 60px;
      margin-bottom: 20px;
    }
    .error-title {
      font-size: 24px;
      margin-bottom: 10px;
    }
    .error-message {
      font-size: 14px;
      color: #999;
      margin-bottom: 20px;
      white-space: pre-line;
      line-height: 1.6;
    }
    .retry-btn {
      padding: 10px 30px;
      background: #1890ff;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    .retry-btn:hover {
      background: #40a9ff;
    }
    .info-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0,0,0,0.7);
      color: #fff;
      padding: 10px 20px;
      font-size: 12px;
      z-index: 100;
    }
    .status-indicator {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 8px;
      animation: pulse 2s infinite;
    }
    .status-live {
      background: #52c41a;
    }
    .status-error {
      background: #ff4d4f;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .controls {
      position: absolute;
      bottom: 60px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      padding: 20px;
      background: linear-gradient(to top, rgba(0,0,0,0.5), transparent);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .player-container:hover .controls {
      opacity: 1;
    }
    .control-btn {
      width: 40px;
      height: 40px;
      background: rgba(255,255,255,0.2);
      border: none;
      border-radius: 50%;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s;
    }
    .control-btn:hover {
      background: rgba(255,255,255,0.3);
    }
    .volume-control {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .volume-slider {
      width: 100px;
      height: 4px;
      background: rgba(255,255,255,0.3);
      border-radius: 2px;
      cursor: pointer;
      position: relative;
    }
    .volume-slider-fill {
      height: 100%;
      background: #1890ff;
      border-radius: 2px;
      width: 80%;
      transition: width 0.1s;
    }
  </style>
</head>
<body>
  <div class="player-container">
    <div id="video-container">
      <!-- 加载中遮罩 -->
      <div id="loading-overlay" class="loading-overlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">正在連接直播...</div>
      </div>

      <!-- 错误提示 -->
      <div id="error-container" class="error-container" style="display: none;">
        <div class="error-icon">⚠️</div>
        <div class="error-title">直播連接失敗</div>
        <div id="error-message" class="error-message"></div>
        <button class="retry-btn" onclick="retryConnect()">重試</button>
      </div>

      <!-- 视频元素 -->
      <video id="video-player" style="display: none;" controls></video>
    </div>

    <!-- 控制栏 -->
    <div class="controls">
      <button id="play-btn" class="control-btn" onclick="togglePlay()">▶</button>
      <div class="volume-control">
        <button class="control-btn" onclick="toggleMute()">🔊</button>
        <div class="volume-slider" onclick="setVolume(event)">
          <div id="volume-fill" class="volume-slider-fill"></div>
        </div>
      </div>
      <button class="control-btn" onclick="toggleFullscreen()">⛶</button>
    </div>

    <!-- 信息栏 -->
    <div id="info-bar" class="info-bar" style="display: none;">
      <span id="status-indicator" class="status-indicator status-live"></span>
      <span id="status-text">直播中</span>
      <span style="margin-left: 20px;">協議：<span id="protocol-text">-</span></span>
    </div>
  </div>

  <!-- flv.js 用于FLV播放 -->
  <script src="https://cdn.jsdelivr.net/npm/flv.js@1.6.2/dist/flv.min.js"></script>

  <!-- hls.js 用于HLS播放 -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js"></script>

  <script>
    let player = null;
    let liveUrl = '';
    let videoElement = null;
    let currentProtocol = '';

    // 获取URL参数
    function getUrlParam(name) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(name);
    }

    // 检测协议类型
    function detectProtocol(url) {
      if (!url) return 'unknown';
      const lowerUrl = url.toLowerCase();

      if (lowerUrl.startsWith('webrtc://')) return 'webrtc';
      if (lowerUrl.startsWith('rtmp://') || lowerUrl.startsWith('rtmps://')) return 'rtmp';
      if (lowerUrl.includes('.m3u8')) return 'hls';
      if (lowerUrl.includes('.flv')) return 'flv';
      if (lowerUrl.startsWith('http://') || lowerUrl.startsWith('https://')) return 'http';

      return 'unknown';
    }

    // 获取协议描述
    function getProtocolDescription(protocol) {
      const descriptions = {
        'webrtc': 'WebRTC（超低延遲 <1秒）',
        'flv': 'HTTP-FLV（低延遲 2-5秒）',
        'hls': 'HLS（高兼容性 10-30秒）',
        'rtmp': 'RTMP（不推薦）',
        'http': 'HTTP（通用格式）',
        'unknown': '未知協議'
      };
      return descriptions[protocol] || protocol.toUpperCase();
    }

    // 初始化播放器
    function initPlayer() {
      liveUrl = getUrlParam('url');

      if (!liveUrl) {
        showError('未提供直播地址');
        return;
      }

      currentProtocol = detectProtocol(liveUrl);
      const protocolDesc = getProtocolDescription(currentProtocol);
      document.getElementById('protocol-text').textContent = protocolDesc;

      videoElement = document.getElementById('video-player');

      console.log('準備播放:', liveUrl);
      console.log('協議類型:', currentProtocol);

      // 根据协议选择播放器
      if (currentProtocol === 'flv') {
        initFlvPlayer();
      } else if (currentProtocol === 'hls') {
        initHlsPlayer();
      } else if (currentProtocol === 'http') {
        initNativePlayer();
      } else if (currentProtocol === 'rtmp') {
        showError('⚠️ RTMP 協議播放失敗\n\n現代瀏覽器已不支持 RTMP 協議（需要 Flash 插件）。\n\n📋 解決方案：\n請使用 HLS 播放地址（.m3u8 格式）或 HTTP-FLV 格式（.flv 格式）');
      } else {
        showError('不支持的協議類型：' + currentProtocol);
      }
    }

    // 初始化FLV播放器（使用flv.js）
    function initFlvPlayer() {
      if (!flvjs.isSupported()) {
        showError('您的瀏覽器不支持 FLV 播放\n\n請使用 Chrome、Firefox 或 Edge 瀏覽器');
        return;
      }

      try {
        player = flvjs.createPlayer({
          type: 'flv',
          url: liveUrl,
          isLive: true,
          hasAudio: true,
          hasVideo: true,
          enableWorker: true,
          enableStashBuffer: false,
          stashInitialSize: 128,
          autoCleanupSourceBuffer: true
        }, {
          enableWorker: true,
          enableStashBuffer: false,
          autoCleanupSourceBuffer: true
        });

        player.attachMediaElement(videoElement);

        // 监听事件
        player.on(flvjs.Events.ERROR, (errorType, errorDetail, errorInfo) => {
          console.error('FLV播放錯誤:', errorType, errorDetail, errorInfo);

          let errorMsg = 'FLV 播放失敗\n\n';

          if (errorType === 'NetworkError') {
            errorMsg += '網絡錯誤：無法連接到直播流\n\n';
            errorMsg += '可能原因：\n';
            errorMsg += '1. 直播尚未開始\n';
            errorMsg += '2. 網絡連接問題\n';
            errorMsg += '3. 直播地址已過期\n\n';
            errorMsg += '💡 請確認 OBS 已開始推流';
          } else if (errorType === 'MediaError') {
            errorMsg += '媒體錯誤：視頻格式問題\n\n';
            errorMsg += '請聯繫技術支持';
          } else {
            errorMsg += '錯誤類型：' + errorType + '\n';
            errorMsg += '錯誤詳情：' + errorDetail;
          }

          showError(errorMsg);
        });

        player.on(flvjs.Events.LOADING_COMPLETE, () => {
          console.log('FLV加載完成');
        });

        player.on(flvjs.Events.RECOVERED_EARLY_EOF, () => {
          console.log('FLV恢復連接');
        });

        player.load();

        // 等待元数据加载
        videoElement.addEventListener('loadedmetadata', () => {
          console.log('✅ 元數據加載完成');
          hideLoading();
          showInfoBar('直播中', true);
        });

        // 开始播放
        videoElement.play().then(() => {
          console.log('✅ 播放成功');
          document.getElementById('play-btn').textContent = '⏸';
        }).catch(err => {
          console.error('播放失敗:', err);
          showError('自動播放失敗\n\n請點擊播放按鈕手動播放');
        });

        // 播放事件
        videoElement.addEventListener('playing', () => {
          hideLoading();
          showInfoBar('直播中', true);
        });

        videoElement.addEventListener('waiting', () => {
          showInfoBar('緩衝中...', true);
        });

        videoElement.addEventListener('error', (e) => {
          console.error('Video元素錯誤:', e);
          showError('視頻播放錯誤\n\n請檢查直播流是否正常');
        });

      } catch (error) {
        console.error('FLV播放器初始化失敗:', error);
        showError('播放器初始化失敗：' + error.message);
      }
    }

    // 初始化HLS播放器（使用hls.js）
    function initHlsPlayer() {
      if (Hls.isSupported()) {
        player = new Hls({
          enableWorker: true,
          lowLatencyMode: true,
          backBufferLength: 90
        });

        player.loadSource(liveUrl);
        player.attachMedia(videoElement);

        player.on(Hls.Events.MANIFEST_PARSED, () => {
          console.log('✅ HLS清單解析成功');
          hideLoading();
          showInfoBar('直播中', true);

          videoElement.play().catch(err => {
            console.error('播放失敗:', err);
            showError('自動播放失敗\n\n請點擊播放按鈕手動播放');
          });
        });

        player.on(Hls.Events.ERROR, (event, data) => {
          console.error('HLS錯誤:', data);

          if (data.fatal) {
            let errorMsg = 'HLS 播放失敗\n\n';

            switch(data.type) {
              case Hls.ErrorTypes.NETWORK_ERROR:
                errorMsg += '網絡錯誤：無法加載直播流\n\n請檢查直播是否已開始';
                player.startLoad();
                break;
              case Hls.ErrorTypes.MEDIA_ERROR:
                errorMsg += '媒體錯誤\n\n正在嘗試恢復...';
                player.recoverMediaError();
                break;
              default:
                errorMsg += '未知錯誤\n\n' + data.type;
                showError(errorMsg);
                break;
            }
          }
        });

      } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
        // iOS Safari 原生支持
        videoElement.src = liveUrl;
        videoElement.addEventListener('loadedmetadata', () => {
          hideLoading();
          showInfoBar('直播中', true);
        });
        videoElement.play();
      } else {
        showError('您的瀏覽器不支持 HLS 播放');
      }
    }

    // 初始化原生播放器（MP4等）
    function initNativePlayer() {
      videoElement.src = liveUrl;
      videoElement.addEventListener('loadedmetadata', () => {
        hideLoading();
        showInfoBar('直播中', true);
      });
      videoElement.play().catch(err => {
        showError('播放失敗：' + err.message);
      });
    }

    // 显示错误
    function showError(message) {
      hideLoading();
      document.getElementById('video-player').style.display = 'none';
      document.getElementById('error-message').textContent = message;
      document.getElementById('error-container').style.display = 'block';
      showInfoBar('連接失敗', false);
      document.getElementById('status-indicator').className = 'status-indicator status-error';
    }

    // 隐藏加载
    function hideLoading() {
      document.getElementById('loading-overlay').style.display = 'none';
      document.getElementById('video-player').style.display = 'block';
    }

    // 显示信息栏
    function showInfoBar(statusText, isLive) {
      document.getElementById('info-bar').style.display = 'block';
      document.getElementById('status-text').textContent = statusText;

      const indicator = document.getElementById('status-indicator');
      indicator.className = 'status-indicator ' + (isLive ? 'status-live' : 'status-error');
    }

    // 重试连接
    function retryConnect() {
      document.getElementById('error-container').style.display = 'none';
      document.getElementById('loading-overlay').style.display = 'flex';

      if (player) {
        if (currentProtocol === 'flv') {
          player.unload();
          player.detachMediaElement();
          player.destroy();
        } else if (currentProtocol === 'hls') {
          player.destroy();
        }
        player = null;
      }

      videoElement.src = '';
      setTimeout(initPlayer, 500);
    }

    // 播放/暂停
    function togglePlay() {
      if (!videoElement) return;

      if (videoElement.paused) {
        videoElement.play();
        document.getElementById('play-btn').textContent = '⏸';
      } else {
        videoElement.pause();
        document.getElementById('play-btn').textContent = '▶';
      }
    }

    // 静音/取消静音
    function toggleMute() {
      if (!videoElement) return;
      videoElement.muted = !videoElement.muted;
    }

    // 设置音量
    function setVolume(event) {
      if (!videoElement) return;

      const slider = event.currentTarget;
      const rect = slider.getBoundingClientRect();
      const percent = (event.clientX - rect.left) / rect.width;

      videoElement.volume = Math.max(0, Math.min(1, percent));
      document.getElementById('volume-fill').style.width = (percent * 100) + '%';
    }

    // 全屏
    function toggleFullscreen() {
      const container = document.getElementById('video-container');

      if (!document.fullscreenElement) {
        container.requestFullscreen().catch(err => {
          console.error('全屏失敗:', err);
        });
      } else {
        document.exitFullscreen();
      }
    }

    // 页面加载时初始化
    window.addEventListener('load', initPlayer);

    // 页面卸载时销毁播放器
    window.addEventListener('beforeunload', () => {
      if (player) {
        if (currentProtocol === 'flv') {
          player.unload();
          player.detachMediaElement();
          player.destroy();
        } else if (currentProtocol === 'hls') {
          player.destroy();
        }
      }
    });

    // 3秒后如果还在加载，显示提示
    setTimeout(() => {
      if (document.getElementById('loading-overlay').style.display !== 'none') {
        document.querySelector('.loading-text').innerHTML = '連接時間較長，請稍候...<br><small style="color: #999; font-size: 12px;">請確認直播流已開始推送</small>';
      }
    }, 3000);
  </script>
</body>
</html>
